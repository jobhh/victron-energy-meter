name: Temporary lint report

on:
  push:
    branches: [tmp-lint]

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - name: Format, lint and type check, keeping the output
        run: |
          uv run ruff format . > lint-report.txt 2>&1 || true
          uv run ruff check . >> lint-report.txt 2>&1 || true
          uv run ruff check --fix . >> lint-report.txt 2>&1 || true
          uv run mypy >> lint-report.txt 2>&1 || true
      - name: Commit the result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git rm -q .github/workflows/tmp-lint.yml
          git add -A
          git commit -m "Lint report" && git push
